spring.application.name=RESET
server.port=8080
server.address=0.0.0.0

#spring.datasource.url=jdbc:mysql://localhost:3306/erp
#spring.datasource.username=root
#spring.datasource.password=admin@#
#spring.jpa.hibernate.ddl-auto=update
##pring.jpa.hibernate.ddl-auto=create-drop
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5432/erp?password=%20%20%22%23
spring.datasource.username=postgres
spring.datasource.password=${  \"#}
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate=DEBUG
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.defer-datasource-initialization=true
#server.error.include-exception=true

jwt.secret=${JWT_SECRET:your-super-secret-key-for-jwt-authentication-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allow-credentials=true